# 空地协同巡检集成平台 - 中间件 Docker Compose
# 组件: HDFS + Kafka + MongoDB + Elasticsearch + Kibana + Nginx
# 单机内存约 8GB,已限制各组件内存避免 OOM

services:
  # ==================== Hadoop HDFS (伪分布式) ====================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: agi-namenode
    hostname: namenode
    ports:
      - "9870:9870"   # NameNode Web UI
      - "9000:9000"   # NameNode RPC
    environment:
      - CLUSTER_NAME=agi
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_client_use_datanode_hostname=true
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - agi-net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: agi-datanode
    hostname: localhost
    depends_on:
      - namenode
    ports:
      - "9866:9866"   # DataNode 数据传输
      - "9864:9864"   # DataNode Web UI
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_datanode_hostname=localhost
      - HDFS_CONF_dfs_client_use_datanode_hostname=true
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - agi-net

  # ==================== Kafka (KRaft 单节点,无需 ZooKeeper) ====================
  kafka:
    image: apache/kafka:3.7.0
    container_name: agi-kafka
    ports:
      - "9092:9092"   # 客户端访问端口
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_DELETE_TOPIC_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_HEAP_OPTS=-Xmx512M -Xms512M
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - agi-net

  # ==================== MongoDB ====================
  mongo:
    image: mongo:7.0
    container_name: agi-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=agi
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - agi-net

  # ==================== Elasticsearch ====================
  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: agi-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -E 'yellow|green' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1.5G
    networks:
      - agi-net

  # ==================== Kibana ====================
  kibana:
    image: kibana:8.13.4
    container_name: agi-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - kibana_data:/usr/share/kibana/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -E 'available|degraded' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - agi-net

  # ==================== Nginx 网关 ====================
  nginx:
    image: nginx:1.25-alpine
    container_name: agi-nginx
    depends_on:
      - elasticsearch
    ports:
      - "80:80"        # 统一网关入口
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - agi-net

volumes:
  hadoop_namenode:
  hadoop_datanode:
  kafka_data:
  mongo_data:
  es_data:
  kibana_data:

networks:
  agi-net:
    driver: bridge
